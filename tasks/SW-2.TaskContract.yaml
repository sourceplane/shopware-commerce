apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: SW-2
  title: "The storefront on Workers"
spec:
  goal: Shopware's Next.js starter runs as one Cloudflare Worker with Static Assets, its Store API reads cached in R2 and revalidated through the Durable Object tag cache by a bearer-checked route, live before a store is connected
  affects:
    - apps/web
    - infra/terraform/cloudflare-r2
    - tests/web
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - README.md
  doneWhen:
    - pnpm typecheck, lint, test and build are green with no Shopware store
    - wrangler dev serves the unconnected storefront without a 500, and a connected one from cached reads revalidated through /api/revalidate
  gates: []
