# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (SW → SW-1, SW-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: shopware-commerce
  key: SW
spec:
  title: "Shopware's Next.js starter on Cloudflare Workers"
  summary: "Shopware's Next.js starter (a Next.js Commerce fork on Shopware 6's Store API) — a home page with a grid and a carousel, categories, search, product pages with variants, a cart and CMS pages, every Store API read a \"use cache\" entry dropped by tag through a bearer-checked route — runs as one Cloudflare Worker with Static Assets, its data cache in R2 and its tag cache and revalidation queue in Durable Objects, live before a Shopware store is connected, and becomes an Orun baseline that takes a new storefront from nothing to live on stage and prod in one landing."
  state: completed
  milestones:
    - name: "SW0 — the spec"
      exitCriteria:
        - "the repository is born with its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [SW-1]
    - name: "SW1 — the storefront on Workers"
      exitCriteria:
        - "apps/web is upstream's starter built by OpenNext into one Worker with Static Assets, the R2 incremental cache, the Durable Object tag cache and queue, Cache Components off and every \"use cache\" read kept"
        - "typecheck, lint, upstream's check, tests/web and build are green with no store"
        - "with no store connected every page answers with the connect note and / says \"Connect your Shopware store\", never a 500; connected, wrangler dev serves the catalogue, reuses the cache and revalidates through the bearer-checked route"
      tasks: [SW-2]
    - name: "SW2 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new storefront from nothing to live on stage and prod in one landing, then record it"
        - "a storefront built from it carries the product only, renamed throughout to its own name, repository, Worker and buckets, with upstream's licence intact"
        - "Baseline CI is green: contract tests, the wiring path, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier — the stage lane's steps in a staged tree, served as born, then connected to a stand-in Store API and browsed"
      tasks: [SW-3]
